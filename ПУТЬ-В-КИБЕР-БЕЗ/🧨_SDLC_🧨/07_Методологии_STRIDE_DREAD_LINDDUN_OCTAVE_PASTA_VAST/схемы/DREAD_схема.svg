<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" font-family="Arial">
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">DREAD - оценка риска</text>
  <rect x="30" y="55" width="220" height="55" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="140" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">D - Damage</text>
  <text x="140" y="98" text-anchor="middle" font-size="11" fill="#333">Ущерб (1-10)</text>
  <rect x="270" y="55" width="220" height="55" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="380" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">R - Reproducibility</text>
  <text x="380" y="98" text-anchor="middle" font-size="11" fill="#333">Воспроизводимость (1-10)</text>
  <rect x="510" y="55" width="220" height="55" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="620" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">E - Exploitability</text>
  <text x="620" y="98" text-anchor="middle" font-size="11" fill="#333">Эксплуатируемость (1-10)</text>
  <rect x="150" y="140" width="220" height="55" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="260" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">A - Affected users</text>
  <text x="260" y="183" text-anchor="middle" font-size="11" fill="#333">Затронутые юзеры (1-10)</text>
  <rect x="390" y="140" width="220" height="55" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="500" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">D - Discoverability</text>
  <text x="500" y="183" text-anchor="middle" font-size="11" fill="#333">Обнаруживаемость (1-10)</text>
  <line x1="260" y1="195" x2="380" y2="235" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="500" y1="195" x2="380" y2="235" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs>
  <rect x="120" y="240" width="520" height="70" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="380" y="268" text-anchor="middle" font-size="15" font-weight="bold" fill="#188038">Risk = (D+R+E+A+D) / 5</text>
  <text x="380" y="292" text-anchor="middle" font-size="12" fill="#333">12-15 высокий | 8-12 средний | 5-8 низкий | 0-5 принять</text>
  <text x="380" y="340" text-anchor="middle" font-size="12" fill="#666">Плюс: быстро, просто. Минус: субъективно. Для быстрой приоритизации.</text>
</svg>