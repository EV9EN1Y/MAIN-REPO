<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" font-family="Arial">
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">VAST - Agile/DevOps threat modeling</text>
  <rect x="40" y="60" width="330" height="120" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="205" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">Application Threat Model</text>
  <text x="205" y="115" text-anchor="middle" font-size="12" fill="#333">Для каждого приложения</text>
  <text x="205" y="135" text-anchor="middle" font-size="12" fill="#333">Разработчики, CI/CD</text>
  <text x="205" y="155" text-anchor="middle" font-size="12" fill="#333">Обновляется с кодом</text>
  <rect x="390" y="60" width="330" height="120" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="555" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">Operational Threat Model</text>
  <text x="555" y="115" text-anchor="middle" font-size="12" fill="#333">Для инфраструктуры</text>
  <text x="555" y="135" text-anchor="middle" font-size="12" fill="#333">DevOps/Ops, IaC</text>
  <text x="555" y="155" text-anchor="middle" font-size="12" fill="#333">Сеть, облако, кластеры</text>
  <rect x="120" y="210" width="520" height="80" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="380" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#188038">Принципы: Visual · Agile · Simple · Scalable · Automated</text>
  <text x="380" y="262" text-anchor="middle" font-size="12" fill="#333">Threat modeling as code: модель в yaml, триггер от изменений IaC</text>
  <text x="380" y="280" text-anchor="middle" font-size="11" fill="#666">Инструмент: ThreatModeler</text>
</svg>