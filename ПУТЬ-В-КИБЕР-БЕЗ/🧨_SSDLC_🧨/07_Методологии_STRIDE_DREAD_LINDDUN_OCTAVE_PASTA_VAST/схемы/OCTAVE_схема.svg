<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" font-family="Arial">
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">OCTAVE - 3 фазы (организация)</text>
  <rect x="40" y="60" width="213" height="130" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="146" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">Фаза 1</text>
  <text x="146" y="112" text-anchor="middle" font-size="12" fill="#333">Профили активов</text>
  <text x="146" y="135" text-anchor="middle" font-size="11" fill="#666">Что ценно?</text>
  <text x="146" y="155" text-anchor="middle" font-size="11" fill="#666">Критичность</text>
  <text x="146" y="175" text-anchor="middle" font-size="11" fill="#666">Требования</text>
  <rect x="273" y="60" width="213" height="130" rx="10" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="380" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">Фаза 2</text>
  <text x="380" y="112" text-anchor="middle" font-size="12" fill="#333">Уязвимости инфраструктуры</text>
  <text x="380" y="135" text-anchor="middle" font-size="11" fill="#666">Сеть, серверы</text>
  <text x="380" y="155" text-anchor="middle" font-size="11" fill="#666">Приложения</text>
  <text x="380" y="175" text-anchor="middle" font-size="11" fill="#666">Слабые места</text>
  <rect x="506" y="60" width="213" height="130" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="613" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#188038">Фаза 3</text>
  <text x="613" y="112" text-anchor="middle" font-size="12" fill="#333">План безопасности</text>
  <text x="613" y="135" text-anchor="middle" font-size="11" fill="#666">Оценка рисков</text>
  <text x="613" y="155" text-anchor="middle" font-size="11" fill="#666">Стратегии</text>
  <text x="613" y="175" text-anchor="middle" font-size="11" fill="#666">План мер</text>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs>
  <line x1="253" y1="125" x2="271" y2="125" stroke="#555" stroke-width="2" marker-end="url(#b)"/>
  <line x1="486" y1="125" x2="504" y2="125" stroke="#555" stroke-width="2" marker-end="url(#b)"/>
  <rect x="120" y="220" width="520" height="70" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
  <text x="380" y="248" text-anchor="middle" font-size="13" fill="#333">Варианты: OCTAVE (крупные), OCTAVE-S (малые), OCTAVE-Allegro (активы)</text>
  <text x="380" y="272" text-anchor="middle" font-size="12" fill="#666">Результат: план безопасности организации, риски для руководства</text>
</svg>