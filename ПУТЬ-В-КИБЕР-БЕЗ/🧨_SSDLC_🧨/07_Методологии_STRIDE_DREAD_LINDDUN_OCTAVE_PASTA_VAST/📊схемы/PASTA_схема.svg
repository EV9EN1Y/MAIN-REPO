<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" font-family="Arial">
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">PASTA - 7 ступеней (атак-центричный)</text>
  <rect x="40" y="55" width="97" height="55" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="88" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">1. Цели</text>
  <text x="88" y="96" text-anchor="middle" font-size="10" fill="#333">бизнес</text>
  <rect x="150" y="55" width="97" height="55" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="198" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">2. Скоуп</text>
  <text x="198" y="96" text-anchor="middle" font-size="10" fill="#333">технологии</text>
  <rect x="260" y="55" width="97" height="55" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="308" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">3. Декомп.</text>
  <text x="308" y="96" text-anchor="middle" font-size="10" fill="#333">DFD</text>
  <rect x="370" y="55" width="97" height="55" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="418" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#b06000">4. Угрозы</text>
  <text x="418" y="96" text-anchor="middle" font-size="10" fill="#333">классы</text>
  <rect x="480" y="55" width="97" height="55" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="528" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#b06000">5. Уязвим.</text>
  <text x="528" y="96" text-anchor="middle" font-size="10" fill="#333">CVE/CWE</text>
  <rect x="590" y="55" width="97" height="55" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="638" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#b06000">6. Атаки</text>
  <text x="638" y="96" text-anchor="middle" font-size="10" fill="#333">деревья</text>
  <rect x="700" y="55" width="60" height="55" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="730" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#188038">7. Риск</text>
  <text x="730" y="96" text-anchor="middle" font-size="10" fill="#333">контрмеры</text>
  <defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs>
  <line x1="137" y1="82" x2="148" y2="82" stroke="#555" stroke-width="2" marker-end="url(#c)"/>
  <line x1="247" y1="82" x2="258" y2="82" stroke="#555" stroke-width="2" marker-end="url(#c)"/>
  <line x1="357" y1="82" x2="368" y2="82" stroke="#555" stroke-width="2" marker-end="url(#c)"/>
  <line x1="467" y1="82" x2="478" y2="82" stroke="#555" stroke-width="2" marker-end="url(#c)"/>
  <line x1="577" y1="82" x2="588" y2="82" stroke="#555" stroke-width="2" marker-end="url(#c)"/>
  <line x1="687" y1="82" x2="698" y2="82" stroke="#555" stroke-width="2" marker-end="url(#c)"/>
  <rect x="80" y="140" width="600" height="90" rx="10" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
  <text x="380" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Дерево атаки (ступень 6)</text>
  <text x="380" y="188" text-anchor="middle" font-size="11" fill="#555">Цель: аккаунт админа</text>
  <text x="380" y="206" text-anchor="middle" font-size="11" fill="#555">брутфорс | XSS | сброс пароля | CVE | фишинг</text>
  <text x="380" y="224" text-anchor="middle" font-size="11" fill="#555">каждая ветка - контрмера</text>
  <text x="380" y="280" text-anchor="middle" font-size="12" fill="#666">Особенность: связь бизнес-целей с реальными CVE, моделирование атак</text>
</svg>