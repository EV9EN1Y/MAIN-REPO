<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" font-family="Arial">
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">STRIDE - 6 категорий угроз</text>
  <rect x="30" y="55" width="220" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="140" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">S - Spoofing</text>
  <text x="140" y="100" text-anchor="middle" font-size="12" fill="#333">Подмена / подделка</text>
  <rect x="270" y="55" width="220" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="380" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">T - Tampering</text>
  <text x="380" y="100" text-anchor="middle" font-size="12" fill="#333">Вмешательство</text>
  <rect x="510" y="55" width="220" height="60" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="620" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a73e8">R - Repudiation</text>
  <text x="620" y="100" text-anchor="middle" font-size="12" fill="#333">Отказ от действий</text>
  <rect x="30" y="145" width="220" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="140" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">I - Info Disclosure</text>
  <text x="140" y="190" text-anchor="middle" font-size="12" fill="#333">Раскрытие информации</text>
  <rect x="270" y="145" width="220" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="380" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">D - Denial of Service</text>
  <text x="380" y="190" text-anchor="middle" font-size="12" fill="#333">Отказ в обслуживании</text>
  <rect x="510" y="145" width="220" height="60" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="620" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#b06000">E - Elevation</text>
  <text x="620" y="190" text-anchor="middle" font-size="12" fill="#333">Повышение привилегий</text>
  <rect x="80" y="240" width="600" height="80" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="380" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#188038">Контрмеры</text>
  <text x="380" y="292" text-anchor="middle" font-size="12" fill="#333">Auth, целостность, аудит, шифрование, rate-limit, авторизация</text>
  <rect x="80" y="340" width="600" height="60" rx="8" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
  <text x="380" y="365" text-anchor="middle" font-size="13" fill="#333">Как применять: DFD -> для каждого элемента 6 вопросов "что если"</text>
  <text x="380" y="385" text-anchor="middle" font-size="12" fill="#666">S? T? R? I? D? E? -> таблица угроз -> контрмеры</text>
</svg>