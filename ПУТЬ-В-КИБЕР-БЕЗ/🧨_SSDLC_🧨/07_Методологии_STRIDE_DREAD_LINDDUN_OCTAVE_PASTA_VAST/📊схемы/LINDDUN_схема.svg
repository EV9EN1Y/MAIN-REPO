<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" font-family="Arial">
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#202124">LINDDUN - угрозы приватности</text>
  <rect x="30" y="55" width="225" height="50" rx="8" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="142" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#9334e6">L - Linkability</text>
  <text x="142" y="94" text-anchor="middle" font-size="11" fill="#333">Связываемость</text>
  <rect x="268" y="55" width="225" height="50" rx="8" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="380" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#9334e6">I - Identifiability</text>
  <text x="380" y="94" text-anchor="middle" font-size="11" fill="#333">Идентифицируемость</text>
  <rect x="506" y="55" width="225" height="50" rx="8" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="618" y="77" text-anchor="middle" font-size="13" font-weight="bold" fill="#9334e6">N - Non-repudiation</text>
  <text x="618" y="94" text-anchor="middle" font-size="11" fill="#333">Неотказуемость</text>
  <rect x="30" y="125" width="225" height="50" rx="8" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="142" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#9334e6">D - Detectability</text>
  <text x="142" y="164" text-anchor="middle" font-size="11" fill="#333">Обнаруживаемость</text>
  <rect x="268" y="125" width="225" height="50" rx="8" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="380" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#9334e6">D - Disclosure</text>
  <text x="380" y="164" text-anchor="middle" font-size="11" fill="#333">Раскрытие</text>
  <rect x="506" y="125" width="225" height="50" rx="8" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="618" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#9334e6">U - Unawareness</text>
  <text x="618" y="164" text-anchor="middle" font-size="11" fill="#333">Неосведомлённость</text>
  <rect x="268" y="200" width="225" height="50" rx="8" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="380" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#9334e6">N - Non-compliance</text>
  <text x="380" y="239" text-anchor="middle" font-size="11" fill="#333">Несоответствие закону</text>
  <text x="380" y="280" text-anchor="middle" font-size="12" fill="#666">Применение: системы с ПДн (ФЗ-152, GDPR). Дополняет STRIDE.</text>
</svg>